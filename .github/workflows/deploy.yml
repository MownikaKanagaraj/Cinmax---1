name: CINMAX Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-website:
    name: Deploy Website to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Cloudflare Credentials
        id: check_creds
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "Cloudflare secrets (CLOUDFLARE_API_TOKEN) not set. Skipping deployment."
          fi

      - name: Install pnpm
        if: steps.check_creds.outputs.configured == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.check_creds.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.check_creds.outputs.configured == 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Build Website
        if: steps.check_creds.outputs.configured == 'true'
        run: pnpm --filter @cinmax/website build
        env:
          NEXT_PUBLIC_APP_URL: https://cinmaxglobal.com
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Pages
        if: steps.check_creds.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/website/.next --project-name=cinmax-website

  deploy-admin:
    name: Deploy Admin Portal to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Cloudflare Credentials
        id: check_creds
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "Cloudflare secrets (CLOUDFLARE_API_TOKEN) not set. Skipping deployment."
          fi

      - name: Install pnpm
        if: steps.check_creds.outputs.configured == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.check_creds.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.check_creds.outputs.configured == 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Build Admin
        if: steps.check_creds.outputs.configured == 'true'
        run: pnpm --filter @cinmax/admin build
        env:
          NEXT_PUBLIC_ADMIN_URL: https://admin.cinmaxglobal.com
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Pages
        if: steps.check_creds.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/admin/.next --project-name=cinmax-admin
